version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.dnsChallenge.delayBeforeCheck=0"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - web

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "mediawiki"
      MYSQL_USER: "wikiuser"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - web

  mediawiki:
    image: mediawiki:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MEDIAWIKI_DB_TYPE: "mysql"
      MEDIAWIKI_DB_HOST: "db"
      MEDIAWIKI_DB_PORT: "3306"
      MEDIAWIKI_DB_NAME: "mediawiki"
      MEDIAWIKI_DB_USER: "wikiuser"
      MEDIAWIKI_DB_PASSWORD: "${MYSQL_PASSWORD}"
      MEDIAWIKI_SITE_NAME: "My Wiki"
      MEDIAWIKI_SITE_LANG: "en"
      MEDIAWIKI_ADMIN_USER: "admin"
      MEDIAWIKI_ADMIN_PASS: "${MEDIAWIKI_ADMIN_PASS}"
      MEDIAWIKI_ADMIN_EMAIL: "admin@${DOMAIN}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mediawiki.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mediawiki.entrypoints=websecure"
      - "traefik.http.routers.mediawiki.tls=true"
      - "traefik.http.routers.mediawiki.tls.certresolver=le"
      - "traefik.http.routers.mediawiki.service=mediawiki-svc"
      - "traefik.http.services.mediawiki-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.mediawiki.middlewares=prevent_scrape@file"
      - "traefik.http.routers.mediawiki-api.rule=Host(`${DOMAIN}`) && Path(`/api.php`)"
      - "traefik.http.routers.mediawiki-api.entrypoints=websecure"
      - "traefik.http.routers.mediawiki-api.tls=true"
      - "traefik.http.routers.mediawiki-api.tls.certresolver=le"
      - "traefik.http.routers.mediawiki-api.middlewares=api_ratelimit@file"
      - "traefik.http.services.mediawiki-api.loadbalancer.server.port=80"
    volumes:
      - ./data/images:/var/www/html/images
    networks:
      - web

networks:
  web:
    driver: bridge